title: Chamomile Shortbread
byline: Placeholder
location: Garden
make_verb: Bake
components:
  -
    - Shortbread
    - 1 c unsalted butter, softened
    - 1/2 c powdered sugar
    - 2 c all-purpose flour
    - 2 tbsp dried chamomile flowers
    - 1/4 tsp kosher salt
directions:
  -
    - Shortbread
    - Preheat oven to 325 °F.
    - Cream {1 c unsalted butter, softened} and {1/2 c powdered sugar} until fluffy.
    - Stir together {2 c all-purpose flour}, {2 tbsp dried chamomile flowers}, and {1/4 tsp kosher salt}.
    - Mix dry ingredients into butter mixture until just combined.
    - Press dough into an 8-inch square pan. Prick all over with a fork.
    - Bake 25 minutes until edges are barely golden.
  - Cool completely before cutting into fingers.
background: A delicate teatime cookie infused with chamomile — pairs perfectly with a cup of tea.
flavor: Calm in cookie form.
pack: wildflower
