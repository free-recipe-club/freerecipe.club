title: "[Placeholder] Rosemary Focaccia"
byline: Placeholder
location: Garden
make_verb: Bake
components:
  -
    - Dough
    - 3 c all-purpose flour
    - 1 tsp kosher salt
    - 1 pkg (2 1/4 tsp) active dry yeast
    - 1 1/4 c warm water
    - 3 tbsp olive oil
  -
    - Topping
    - 2 tbsp olive oil
    - 1 tbsp fresh rosemary leaves
    - flaky sea salt
directions:
  -
    - Dough
    - Dissolve {1 pkg (2 1/4 tsp) active dry yeast} in {1 1/4 c warm water}. Let stand 5 minutes.
    - Mix {3 c all-purpose flour} and {1 tsp kosher salt} in a bowl.
    - Add yeast mixture and {3 tbsp olive oil}. Stir until a shaggy dough forms.
    - Cover and let rise 1 hour until doubled.
  -
    - Topping
    - Press dough into an oiled baking sheet. Dimple with fingers.
    - Drizzle {2 tbsp olive oil} over top. Scatter {1 tbsp fresh rosemary leaves} and {flaky sea salt}.
    - Bake at 425 °F for 20 minutes until golden.
background: A simple bread that fills the kitchen with the scent of rosemary.
flavor: Warm bread, fresh herbs.
pack: wildflower
