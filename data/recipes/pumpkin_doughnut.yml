title: Pumpkin Doughnut
byline: Michelle Weinfeld-Geller
location: Michigan
make_verb: Bake
components:
  -
    - Doughnuts
    - text: 2 c all-purpose flour
      annotations:
        - text: 2 c gluten-free 1-to-1 baking flour
          explanation: Use this for a gluten-free version
          type: substitution
          contributor: jared
    - 2 tsp pumpkin pie spice
    - 2 tsp baking powder
    - 1 tsp kosher salt
    - 1 can (15 oz) pumpkin puree
    - 1 1/2 c sugar
    - 1/3 c vegetable oil
    - 4 tbsp unsalted butter, melted
    - 1 tsp vanilla extract
    - 3 lg eggs
  -
    - Topping
    - 3/4 c sugar
    - 2 tsp ground cinnamon
    - 3 tbsp unsalted butter, melted
directions:
  -
    - Doughnuts
    - Preheat oven to 350 °F.
    - Whisk {2 c all-purpose flour}, {2 tsp pumpkin pie spice}, {2 tsp baking powder}, and {1 tsp kosher salt} in a bowl.
    - Beat {1 can (15 oz) pumpkin puree}, {1 1/2 c sugar}, {1/3 c vegetable oil}, {4 tbsp unsalted butter, melted}, {1 tsp vanilla extract}, and {3 lg eggs} in a bowl until smooth.
    - Add flour mixture to the pumpkin mixture and beat until combined.
    - Fill doughnut pants with batter until almost full. Smooth tops with moistened finger.
    - text: Bake doughnuts about 15 minutes. Check with toothpick.
      annotations:
        - text: Gluten-free batter may need 2-3 extra minutes. Look for golden edges and a clean toothpick.
          type: tip
          contributor: jared
  -
    - Topping
    - Stir {3/4 c sugar} and {2 tsp ground cinnamon} in bowl. Brush doughnuts with {3 tbsp unsalted butter, melted} and dip in cinnamon sugar.
  - Serve warm or room temperature.
background: Our family really loves doughnuts! With it being fall, I needed to find a pumpkin recipe. I found the directions easy to follow and they came out delicious! This recipe is a keeper!
