title: "[Placeholder] Lemon Orzo"
byline: Placeholder
location: Garden
make_verb: Cook
components:
  -
    - Orzo
    - 1 lb orzo
    - 3 tbsp olive oil
    - 3 cloves garlic, minced
    - 2 lemons, zested and juiced
    - 1/4 c fresh dill, chopped
    - 1/4 c fresh parsley, chopped
    - 1/2 c crumbled feta
    - 1/4 tsp black pepper
directions:
  -
    - Orzo
    - Cook {1 lb orzo} according to package directions. Drain and set aside.
    - Heat {3 tbsp olive oil} in a large skillet over medium heat. Add {3 cloves garlic, minced} and cook 1 minute.
    - Add orzo to the skillet. Stir in {2 lemons, zested and juiced} and {1/4 tsp black pepper}. Toss to coat.
    - Remove from heat. Fold in {1/4 c fresh dill, chopped} and {1/4 c fresh parsley, chopped}.
  - Top with {1/2 c crumbled feta} and serve.
background: Bright, lemony, and light — the kind of simple dish that feels like a warm afternoon.
flavor: Sun-kissed citrus over tender orzo.
pack: wildflower
