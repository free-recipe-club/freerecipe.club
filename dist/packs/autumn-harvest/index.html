<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autumn Harvest — freerecipe.club</title>
  <link rel="stylesheet" href="/styles/output.css">
</head>
<body class="theme-autumn-harvest min-h-screen">
  <nav class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between print:hidden" style="background:var(--theme-nav-bg)">
    <a href="/" class="text-xl font-bold hover:underline" style="color:var(--theme-accent)">freerecipe.club</a>
    <div class="flex items-center gap-4">
      <a href="/recipes" class="text-lg hover:underline" style="color:var(--theme-accent)">Recipes</a>
      <a href="/packs" class="text-lg hover:underline" style="color:var(--theme-accent)">Packs</a>
    </div>
  </nav>
  <main class="max-w-2xl mx-auto px-4 py-8">
  <div class="text-center mb-8">
    <div class="text-5xl mb-4">🍂</div>
    <h1 class="text-4xl font-bold mb-4" style="font-family:var(--theme-heading-font);color:var(--theme-text)">Autumn Harvest</h1>
    <p class="leading-relaxed max-w-lg mx-auto" style="color:var(--theme-text-secondary)">Warm spices, golden leaves, and cozy kitchen moments. A collection of recipes for fall evenings.</p>
  </div>
  <hr class="my-8" style="border-color:var(--theme-divider)">
  <div class="flex flex-col gap-4">
    <a href="/recipes/pumpkin-doughnut" class="block rounded-lg p-4 transition-colors" style="background:var(--theme-surface);border:1px solid var(--theme-border)" onmouseover="this.style.background='var(--theme-surface-hover)'" onmouseout="this.style.background='var(--theme-surface)'">
      <div class="flex items-start justify-between">
        <div>
          <h2 class="text-2xl font-bold mb-1" style="font-family:var(--theme-heading-font)">Pumpkin Doughnut</h2>
          <p class="text-sm font-bold" style="color:var(--theme-text-secondary)">Michelle Weinfeld-Geller, Michigan</p>
          <p class="text-base font-bold mt-2" style="color:var(--theme-accent)">Start Baking →</p>
        </div>
        <span class="flex items-center justify-center w-6 h-6 rounded-full text-sm flex-shrink-0" style="background:var(--theme-badge-bg);color:var(--theme-badge-text)" aria-hidden="true">🍂</span>
      </div>
    </a>
  </div>
</main>
</body>
</html>
