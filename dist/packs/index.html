<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Themed Packs — freerecipe.club</title>
  <link rel="stylesheet" href="/styles/output.css">
</head>
<body class="theme-autumn-harvest min-h-screen">
  <nav class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between print:hidden" style="background:var(--theme-nav-bg)">
    <a href="/" class="text-xl font-bold hover:underline" style="color:var(--theme-accent)">freerecipe.club</a>
    <div class="flex items-center gap-4">
      <a href="/recipes" class="text-lg hover:underline" style="color:var(--theme-accent)">Recipes</a>
      <a href="/packs" class="text-lg hover:underline" style="color:var(--theme-accent)">Packs</a>
    </div>
  </nav>
  <main class="max-w-2xl mx-auto px-4 py-8">
  <h1 class="text-4xl font-bold mb-2" style="font-family:var(--theme-heading-font)">Themed Packs</h1>
  <p class="mb-8 leading-relaxed" style="color:var(--theme-text-secondary)">Curated collections that transform the site.</p>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
    <a href="/packs/autumn-harvest" class="block rounded-lg p-4 transition-colors" style="background:var(--theme-surface);border:1px solid var(--theme-border);border-top:4px solid #c2410c" onmouseover="this.style.background='var(--theme-surface-hover)';this.style.boxShadow='0 2px 8px rgba(0,0,0,0.08)'" onmouseout="this.style.background='var(--theme-surface)';this.style.boxShadow='none'">
      <div class="text-3xl mb-2">🍂</div>
      <h2 class="text-2xl font-bold mb-1" style="font-family:var(--theme-heading-font);color:var(--theme-text)">Autumn Harvest</h2>
      <p class="text-sm font-bold" style="color:var(--theme-text-secondary)">1 recipe</p>
    </a>
  </div>
</main>
</body>
</html>
